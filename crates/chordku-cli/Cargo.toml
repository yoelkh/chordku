[package]
name = "chordku-cli"
description = "ChordKu command line: chords | beats | separate | fetch | eval | bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "chordku-cli"
path = "src/main.rs"

[features]
default = ["cuda"]
cuda = ["chordku-core/cuda"]

[dependencies]
chordku-core = { path = "../chordku-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hound = "3.5.1"
