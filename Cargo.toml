[workspace]
resolver = "2"
members = ["crates/chordku-core", "crates/chordku-cli", "crates/chordku-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yoelkh/chordku"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
ndarray = "0.16"
ort = "=2.0.0-rc.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Fast iteration profile: optimized DSP without the long LTO link.
[profile.dev-opt]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
